[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-pump"
version = "0.2.0"
description = "Leakage-safe multi-branch ML research stack for early abnormal-upside and pump prediction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
boosting = ["catboost>=1.2", "lightgbm>=4.0", "xgboost>=2.0"]
deep = ["torch>=2.2"]
v2 = ["catboost>=1.2", "torch>=2.2"]
dev = ["pytest>=8.0"]

[project.scripts]
crypto-pump = "crypto_pump.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
