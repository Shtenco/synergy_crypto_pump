name: Audit LARGE LATOKEN dataset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-large-latoken.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: "34525317429"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download immutable LATOKEN shards
        uses: actions/download-artifact@v4
        with:
          pattern: latoken-large-*
          path: downloaded/latoken
          github-token: ${{ github.token }}
          repository: Shtenco/crypto_pump
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Strict contiguous merge audit
        run: |
          python scripts/merge_real_shards.py downloaded/latoken \
            --min-bars 600 \
            --out data/audit/panel.parquet \
            --report artifacts/audit/data_report.json
          cat artifacts/audit/data_report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: latoken-large-audit-${{ github.run_id }}
          path: artifacts/audit/data_report.json
          retention-days: 30
