name: Train REAL V2 (Uniswap + LATOKEN)

on:
  workflow_dispatch:
    inputs:
      latoken_days:
        description: "LATOKEN history days"
        required: false
        default: "14"
      latoken_max_pairs:
        description: "Maximum LATOKEN USDT pairs; 0 = all"
        required: false
        default: "120"
      uniswap_blocks:
        description: "Recent Ethereum blocks for Uniswap swaps"
        required: false
        default: "80000"
      uniswap_max_pools:
        description: "Maximum recent quote pools"
        required: false
        default: "100"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
  ENVIO_API_TOKEN: ${{ secrets.ENVIO_API_TOKEN }}

jobs:
  train-real-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python stack
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[boosting]'
      - name: Install Rust for Cryo
        uses: dtolnay/rust-toolchain@stable
      - name: Install Cryo
        run: |
          cargo install cryo_cli || true
          cryo --version
      - name: Select RPC fallback
        run: |
          if [ -z "$ETH_RPC_URL" ]; then
            echo "ETH_RPC_URL=https://eth.llamarpc.com" >> "$GITHUB_ENV"
          fi
      - name: Collect real Uniswap + LATOKEN panel
        run: |
          python scripts/build_real_dataset_v2.py \
            --latoken-days "${{ github.event.inputs.latoken_days || '14' }}" \
            --latoken-max-pairs "${{ github.event.inputs.latoken_max_pairs || '120' }}" \
            --uniswap-blocks "${{ github.event.inputs.uniswap_blocks || '80000' }}" \
            --uniswap-max-pools "${{ github.event.inputs.uniswap_max_pools || '100' }}" \
            --out data/real_v2/panel.parquet \
            --report artifacts/real_v2/data_report.json
      - name: Build leakage-safe V2 features
        run: |
          crypto-pump features-v2 data/real_v2/panel.parquet data/real_v2/features.parquet --benchmark-symbol LATOKEN:BTCUSDT
      - name: Build strict multi-horizon labels
        run: |
          crypto-pump labels-v2 data/real_v2/features.parquet data/real_v2/labeled.parquet
      - name: Purged walk-forward OOS training
        run: |
          crypto-pump walk-forward-v2 data/real_v2/labeled.parquet artifacts/real_v2/oos --n-splits 3 --top-k 10 --model-kind catboost
      - name: Fit final V2 model
        run: |
          mkdir -p artifacts/real_v2/model
          crypto-pump train-v2 data/real_v2/labeled.parquet artifacts/real_v2/model/crypto_pump_v2.joblib --model-kind catboost
      - name: Build run summary
        if: always()
        run: |
          python scripts/summarize_real_v2.py || true
          test ! -f artifacts/real_v2/SUMMARY.md || cat artifacts/real_v2/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload dataset/model/reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-pump-real-v2-${{ github.run_id }}
          path: |
            data/real_v2/
            artifacts/real_v2/
          if-no-files-found: warn
          retention-days: 30
