name: Resume LARGE LATOKEN V2 training

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-large-v2-resume.yml"
      - "scripts/train_v2_staged.py"
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "Optional prior staged run ID to restore checkpoints from"
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  SOURCE_RUN_ID: "34525317429"

jobs:
  oos-large:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install training stack
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install 'catboost>=1.2'
      - name: Download all completed LATOKEN shards from source run
        uses: actions/download-artifact@v4
        with:
          pattern: latoken-large-*
          path: downloaded/latoken
          github-token: ${{ github.token }}
          repository: Shtenco/crypto_pump
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Rebuild contiguous large dataset
        run: |
          python scripts/merge_real_shards.py downloaded/latoken \
            --min-bars 600 \
            --out data/real_v2/panel.parquet \
            --report artifacts/real_v2/data_report.json
      - name: Build causal features and strict targets
        run: |
          crypto-pump features-v2 data/real_v2/panel.parquet data/real_v2/features.parquet --benchmark-symbol LATOKEN:BTCUSDT
          crypto-pump labels-v2 data/real_v2/features.parquet data/real_v2/labeled.parquet
      - name: Dataset and target diagnostics
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          d = pd.read_parquet('data/real_v2/labeled.parquet')
          print('rows=', len(d), 'symbols=', d.symbol.nunique(), 'timestamps=', d.timestamp.nunique())
          print('range=', d.timestamp.min(), d.timestamp.max())
          for c in [x for x in d.columns if x.startswith('target__')]:
              x=d[c].dropna()
              print(c, 'n=', len(x), 'positives=', int(x.sum()), 'rate=', float(x.mean()) if len(x) else None)
          print(json.dumps(json.load(open('artifacts/real_v2/data_report.json')), indent=2))
          PY
      - name: Strict 2-fold purged OOS CatBoost + YetiRank
        run: |
          crypto-pump walk-forward-v2 \
            data/real_v2/labeled.parquet \
            artifacts/real_v2/oos \
            --n-splits 2 \
            --top-k 10 \
            --model-kind catboost
      - name: Summarize OOS
        if: always()
        run: |
          python scripts/summarize_real_v2.py || true
          test ! -f artifacts/real_v2/SUMMARY.md || cat artifacts/real_v2/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload OOS continuation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-pump-v2-large-oos-resume-${{ github.run_id }}
          path: |
            artifacts/real_v2/
          if-no-files-found: warn
          retention-days: 30

  final-model-large:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install training stack
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install 'catboost>=1.2'
      - name: Download all completed LATOKEN shards from source run
        uses: actions/download-artifact@v4
        with:
          pattern: latoken-large-*
          path: downloaded/latoken
          github-token: ${{ github.token }}
          repository: Shtenco/crypto_pump
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Rebuild contiguous large dataset
        run: |
          python scripts/merge_real_shards.py downloaded/latoken \
            --min-bars 600 \
            --out data/real_v2/panel.parquet \
            --report artifacts/real_v2/data_report.json
      - name: Build causal features and strict targets
        run: |
          crypto-pump features-v2 data/real_v2/panel.parquet data/real_v2/features.parquet --benchmark-symbol LATOKEN:BTCUSDT
          crypto-pump labels-v2 data/real_v2/features.parquet data/real_v2/labeled.parquet
      - name: Restore prior staged checkpoints
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: crypto-pump-v2-staged-checkpoints-*
          path: artifacts/real_v2/model
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: Shtenco/crypto_pump
          run-id: ${{ inputs.resume_run_id }}
      - name: Fit staged final CatBoost + YetiRank V2 model
        run: |
          mkdir -p artifacts/real_v2/model
          python scripts/train_v2_staged.py \
            data/real_v2/labeled.parquet \
            artifacts/real_v2/model \
            --model-path crypto_pump_v2_large.joblib \
            --classifier-iterations 220 \
            --classifier-depth 6 \
            --ranker-iterations 180 \
            --ranker-depth 5 \
            --learning-rate 0.05 \
            --threads 2
      - name: Publish staged diagnostics
        if: always()
        run: |
          if [ -f artifacts/real_v2/model/stage_report.json ]; then
            cat artifacts/real_v2/model/stage_report.json
            cat artifacts/real_v2/model/stage_report.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload final model and partial checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-pump-v2-staged-checkpoints-${{ github.run_id }}
          path: |
            artifacts/real_v2/model/
          if-no-files-found: warn
          retention-days: 30
